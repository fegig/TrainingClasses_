    <script src="./assets/js/products.js" defer></script>
    <script src="./assets/js/cart.js" defer></script>
    <script src="./assets/js/checkout.js" defer></script>
  </head>

<body>

          <a href="./index.html">
            <img
              src="https://hpanel.hostinger.com/assets/images/logos/hostinger-black.svg"
              alt="this_is_an_image"
            />
          </a>
  
          <div class="flex menu-items active">
            <a href="./contact.html"> Contact Us </a>
  
            <a href="./about.html"> About Us </a>
          </div>
          <a href="./cart.html" id="cart-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shopping-cart">
            <circle cx="8" cy="21" r="1"/>
            <circle cx="19" cy="21" r="1"/>
            <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>

          <button class="bugger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
          </button>
          
        </nav>
        <div class="mobile-menu-items">
          <a href="./contact.html"> Contact Us </a>
  
          <a href="./about.html"> About Us </a>
        </div>
      </header>
    <main>
        <div class="container">
            <h2>Checkout</h2>
            <div class="checkout-page-tabs">
                <div class="tab-title-container">
                    <div class="tab-title"><span class="active">Summary <span class="active-line"></span></span></div>
                    <div class="tab-title"><span >Billing Address <span class="active-line"></span></span></div>
                </div>
                <div class="checkout-page-tab active" id="summary">
                    <div class="checkout-amount">
                        <strong>Amount:</strong>
                        <span id="checkout-amount">0</span>
                    </div>
                    <div class="checkout-tax">
                        <strong>Tax:</strong>
                        <span id="checkout-tax">0</span>
                    </div>
                    <div class="checkout-total">
                        <strong>Total:</strong>
                        <span id="checkout-total">0</span>
                    </div>
                </div>
                <div class="checkout-page-tab" id="billing-address">
                    <h3>Billing Address</h3>
                    <div class="checkout-billing-address-form">
                     <form id="billing-address-form">
                        <div class="checkout-billing-address-form-input form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name">
                        </div>
                        <div class="checkout-billing-address-form-input form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email">
                        </div>
                        <div class="checkout-billing-address-form-input form-group">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" name="phone">
                        </div>
                        <div class="checkout-billing-address-form-input form-group">
                            <label for="address">Address</label>
                            <input type="text" id="address" name="address">
                        </div>
                        <div class="checkout-billing-address-form-input form-group">
                            <label for="city">City</label>
                            <input type="text" id="city" name="city">
                        </div>
                        <div class="checkout-billing-address-form-input form-group">
                            <label for="state">State</label>
                            <input type="text" id="state" name="state">
                        </div>
                        <div class="checkout-billing-address-form-input form-group">
                            <label for="zip">Zip</label>
                            <input type="text" id="zip" name="zip">
                        </div>
                        <div class="checkout-billing-address-form-input form-group">
                            <label for="country">Country</label>
                            <input type="text" id="country" name="country">
                        </div>
                        </form> 
                    </div>
                </div>
                <div class="checkout-page-tab" id="payment-method">
                    <h3>Payment Method</h3>
                    <div class="checkout-payment-method-form">
                        <form id="payment-method-form">
                            <div class="checkout-payment-method-form-input form-group">
                                <label for="payment-method">Payment Method</label>
                                <select id="payment-method" name="payment-method">
                                    <option value="">--select options--</option>
                                    <option value="stripe">Stripe</option>
                                    <option value="alipay">Alipay</option>
                                    <option value="paypal">Paypal</option>
                                    <option value="credit_debit">Credit/Debit</option>
                                    <option value="apple_pay">Apple Pay</option>
                                    <option value="gpay">Gpay</option>
                                    </select>   
                            </div>
                        </form>
                    </div>
                </div>
                <div class="checkout-page-tab" id="order-confirmation">
                    <h3>Order Confirmation</h3>
                    <div class="order-confirmation-form">
                        <form id="order-confirmation-form">
                            <div class="order-confirmation-form-input form-group">
                              <button class="button">Make Payment</button>
                            </div>
                        </form>
                    </div>   
            </div>
            <div class="checkout-page-buttons">
                <button class="button previous" onclick="activeCheckoutPage('previous')">Previous</button>
                <button class="button next" onclick="activeCheckoutPage('next')">Next</button>
            </div>
        </div>
    </main>
    <footer>
        <div class="toast-container">
            <div class="toast" id="toast"></div>
        </div>

          />

        </div>
