<!DOCTYPE html>

<html lang="en">
  <head>
    <meta name="author" content="" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link href="./assets/css/styles.css" rel="stylesheet" />

    <title>Contact Us Page</title>
  </head>

  <body>
    <header>
      <nav class="flex align-center">
        <a href="https://picsum.photos/">
          <img
            src="https://hpanel.hostinger.com/assets/images/logos/hostinger-black.svg"
            alt="this_is_an_image"
          />
        </a>
        <div class="flex">
          <a href="./contact.html"> Contact Us </a>

          <a href="./about.html"> About Us </a>
        </div>
      </nav>
    </header>

    <main class="container">
      <section class="contact">
        <!-- Webform tags-->
        <!-- id -->
        <div id="ticketId">       
        </div>
        <button onclick="copyId(ticketId.innerHTML)">Copy</button>  
        <form id="contactForm" method="post" >
          <div class="form-group">
            <label> email*</label>
            <input type="email" placeholder="Enter Email Address" name="userEmail" />
          </div>

          <div class="form-group">
            <label> phone*</label>
            <input type="tel" placeholder="Enter Phone Number" name="userPhone" />
          </div>

          <div class="form-group">
            <label> message type*</label>
            <select name="userMessageType">
              <option value="">Select Message Type</option>
              <option value="Inquiry">Inquiry</option>
              <option value="Complaint">Complaint</option>
              <option value="Suggestion">Suggestion</option>
            </select>
          </div>

          <div class="form-group">
            <label> message*</label>
            <textarea rows="5" cols="30" name="userMessage"> </textarea>
          </div>

          <div class="form-group">
            <input type="submit" class="button" />
          </div>
          
          <!--submit event trigger-->
        </form>
        <!--response message-->
        <div id="responseMessage"></div>
      </section>
    </main>
  </body>


  <script src="./assets/js/contact.js"></script>
</html>
